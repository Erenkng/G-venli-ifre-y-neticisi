org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official

# R8'in tam kipi: kütüphane kodunda da satır içine alma ve sınıf birleştirme
# yapıyor. Varsayılan kip yalnızca uygulama kodunu iyileştiriyor; tam kip
# Compose gibi çok katmanlı kitaplıklarda çağrı zincirlerini kısaltıyor ve
# hem APK'yı hem kare süresini düşürüyor.
#
# Bedeli: yansımayla erişilen her şeyin proguard kuralında açıkça korunması
# gerekiyor. Kasa'da o kurallar zaten yazılı (serileştiriciler, passkey
# sağlayıcısı, Credential Manager, gizli veri kapları) ve sürüm derlemesi her
# itmede CI'da sınanıyor.
android.enableR8.fullMode=true
