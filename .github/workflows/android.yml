name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Derle (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynagi al
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: SDK 36 bilesenleri
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || \
          sdkmanager "platforms;android-36"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Kotlin hatalari Gradle yigin izinin altinda kaliyor; sona ozet basiyoruz.
      - name: Derle
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; then
            echo "===== KOTLIN HATALARI ====="
            grep -E "^e: |^w: .*error" build.log || echo "(e: satiri yok)"
            echo "===== SON ====="
            exit 1
          fi

      # Sürüm derlemesi ayrıca sınanıyor. R8 küçültmesi yalnızca burada
      # çalışıyor ve hata ayıklama derlemesinde görünmeyen kusurları ortaya
      # çıkarıyor: yansımayla (reflection) erişilen serileştiriciler, passkey
      # sağlayıcısı ve Credential Manager sınıfları, kaynak küçültmesinin
      # kullanılmıyor sandığı çizimler. Bunlar ancak sürüm APK'sı üretilirken
      # anlaşılıyor — ve o an, kullanıcıya gidecek APK'nın üretildiği an.
      - name: Sürüm derlemesi (R8)
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee release.log; then
            echo "===== SÜRÜM DERLEME HATALARI ====="
            grep -E "^e: |R8|Missing class|AGPBI" release.log | tail -40 || echo "(satir yok)"
            echo "===== SON ====="
            exit 1
          fi

      - name: Lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      # Hata ayıklama APK'sı artık yüklenmiyor.
      #
      # Her itmede ~71 MB'lık bir yapı çıktısı yükleniyordu ve saklama süresi
      # varsayılan doksan gündü. Doksan çalışmadan sonra depo doldu ve hesabın
      # yapı çıktısı kotası bitti.
      #
      # Kaybedilen bir şey yok: kurulabilir APK 1.9'dan beri **Sürümler**
      # sayfasında ve orada imzalı, küçültülmüş hâli duruyor. Sürüm varlıkları
      # yapı çıktısı kotasına da girmiyor. Bir dalın APK'sı gerekirse sürüm iş
      # akışı elle çalıştırılabiliyor.

      # Raporlar yalnızca derleme kırıldığında ve kısa süre için.
      # Yeşil bir çalışmanın lint raporunu kimse açmıyor.
      - name: Rapor yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 5
