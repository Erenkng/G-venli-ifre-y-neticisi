<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Üç gradyan ailesinin günün dilimlerine göre yazısız taslağı">
  <defs>
    <radialGradient id="j1" cx="0.1" cy="0" r="1.1"><stop offset="0" stop-color="#CFF3E7"/><stop offset="1" stop-color="#FFFFFF"/></radialGradient>
    <radialGradient id="j2" cx="0.1" cy="0" r="1.1"><stop offset="0" stop-color="#B7ECDA"/><stop offset="1" stop-color="#F4FBF8"/></radialGradient>
    <radialGradient id="j3" cx="0.1" cy="0" r="1.1"><stop offset="0" stop-color="#9FE3CD"/><stop offset="1" stop-color="#EAF7F2"/></radialGradient>
    <radialGradient id="j4" cx="0.1" cy="0" r="1.1"><stop offset="0" stop-color="#7FD3BB"/><stop offset="1" stop-color="#DCEFE8"/></radialGradient>
    <radialGradient id="j5" cx="0.1" cy="0" r="1.1"><stop offset="0" stop-color="#124238"/><stop offset="1" stop-color="#0B1512"/></radialGradient>

    <radialGradient id="s1" cx="0.9" cy="0" r="1.1"><stop offset="0" stop-color="#FFE7C6"/><stop offset="1" stop-color="#FFFDF8"/></radialGradient>
    <radialGradient id="s2" cx="0.9" cy="0" r="1.1"><stop offset="0" stop-color="#FFD9A3"/><stop offset="1" stop-color="#FFF6E8"/></radialGradient>
    <radialGradient id="s3" cx="0.9" cy="0" r="1.1"><stop offset="0" stop-color="#FFC178"/><stop offset="1" stop-color="#FFEEDA"/></radialGradient>
    <radialGradient id="s4" cx="0.9" cy="0" r="1.1"><stop offset="0" stop-color="#F0A05E"/><stop offset="1" stop-color="#F7E0CB"/></radialGradient>
    <radialGradient id="s5" cx="0.9" cy="0" r="1.1"><stop offset="0" stop-color="#3A2610"/><stop offset="1" stop-color="#150D06"/></radialGradient>

    <radialGradient id="d1" cx="0.5" cy="1" r="1.1"><stop offset="0" stop-color="#DCEAF4"/><stop offset="1" stop-color="#FBFDFF"/></radialGradient>
    <radialGradient id="d2" cx="0.5" cy="1" r="1.1"><stop offset="0" stop-color="#C2DCF0"/><stop offset="1" stop-color="#F1F7FC"/></radialGradient>
    <radialGradient id="d3" cx="0.5" cy="1" r="1.1"><stop offset="0" stop-color="#A6CBE9"/><stop offset="1" stop-color="#E4F0F9"/></radialGradient>
    <radialGradient id="d4" cx="0.5" cy="1" r="1.1"><stop offset="0" stop-color="#7FADD8"/><stop offset="1" stop-color="#D3E5F4"/></radialGradient>
    <radialGradient id="d5" cx="0.5" cy="1" r="1.1"><stop offset="0" stop-color="#0F2A40"/><stop offset="1" stop-color="#061019"/></radialGradient>
  </defs>

  <!-- Üç aile, beş dilim. Yazı yok: örnekler kendilerini gösteriyor. -->
  <g stroke="#9FB3AC" stroke-width="1.2">
    <g transform="translate(60 30)">
      <rect x="0"   y="0" width="200" height="60" rx="16" fill="url(#j1)"/>
      <rect x="216" y="0" width="200" height="60" rx="16" fill="url(#j2)"/>
      <rect x="432" y="0" width="200" height="60" rx="16" fill="url(#j3)"/>
      <rect x="648" y="0" width="200" height="60" rx="16" fill="url(#j4)"/>
      <rect x="864" y="0" width="200" height="60" rx="16" fill="url(#j5)"/>
    </g>
    <g transform="translate(60 120)">
      <rect x="0"   y="0" width="200" height="60" rx="16" fill="url(#s1)"/>
      <rect x="216" y="0" width="200" height="60" rx="16" fill="url(#s2)"/>
      <rect x="432" y="0" width="200" height="60" rx="16" fill="url(#s3)"/>
      <rect x="648" y="0" width="200" height="60" rx="16" fill="url(#s4)"/>
      <rect x="864" y="0" width="200" height="60" rx="16" fill="url(#s5)"/>
    </g>
    <g transform="translate(60 210)">
      <rect x="0"   y="0" width="200" height="60" rx="16" fill="url(#d1)"/>
      <rect x="216" y="0" width="200" height="60" rx="16" fill="url(#d2)"/>
      <rect x="432" y="0" width="200" height="60" rx="16" fill="url(#d3)"/>
      <rect x="648" y="0" width="200" height="60" rx="16" fill="url(#d4)"/>
      <rect x="864" y="0" width="200" height="60" rx="16" fill="url(#d5)"/>
    </g>
  </g>
</svg>
