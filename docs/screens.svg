    <circle cx="94" cy="95" r="6" fill="none" stroke="#8B9A95" stroke-width="2"/>
    <line x1="98" y1="99" x2="103" y2="104" stroke="#8B9A95" stroke-width="2" stroke-linecap="round"/>
