    <rect x="54" y="24" width="292" height="592" fill="url(#gJade)"/>
    <rect x="54" y="24" width="292" height="592" fill="url(#gAmber)"/>
    <rect x="54" y="24" width="292" height="592" fill="url(#gBlue)"/>

    <!-- arama çubuğu -->
