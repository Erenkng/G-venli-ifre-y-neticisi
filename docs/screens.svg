      <text font-family="ui-monospace, Menlo, Consolas, monospace" fill="#10201C" x="512" y="396" font-size="13">•••</text>
      <circle cx="694" cy="383" r="13" fill="#E4EBE8"/>
      <circle cx="724" cy="383" r="13" fill="#E4EBE8"/>
    </g>
    <g>
      <rect x="494" y="420" width="252" height="58" rx="16" fill="#F1F5F3"/>
      <text font-size="9" font-weight="700" letter-spacing="1.1" fill="#8B9A95" x="512" y="441">NOTLAR</text>
      <text font-size="10.5" fill="#4A5C57" x="512" y="461">Yurt dışı kullanıma açık</text>
