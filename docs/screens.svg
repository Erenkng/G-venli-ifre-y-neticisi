    <text  x="700" y="238" font-size="7.5" letter-spacing="0.8" fill="#FFFFFF" fill-opacity="0.55">AY/YIL</text>
    <text font-family="ui-monospace, Menlo, Consolas, monospace" x="700" y="249" font-size="10" fill="#FFFFFF" fill-opacity="0.92">09/28</text>

    <!-- alan blokları -->
    <g>
      <rect x="494" y="288" width="252" height="58" rx="16" fill="#F1F5F3"/>
      <text font-size="9" font-weight="700" letter-spacing="1.1" fill="#8B9A95" x="512" y="309">KART SAHİBİ</text>
      <text font-size="13" font-weight="600" fill="#10201C" x="512" y="329">Eren Köng</text>
