<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-label="Kasa'nın üç ekranı: kasa listesi, kart ayrıntısı, üreteç">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243230"/>
      <stop offset="1" stop-color="#0E1817"/>
    </linearGradient>

    <!-- Uygulamanın jade gradyan zemini: sol üst jade, sağ üst kehribar, alt mavi -->
    <radialGradient id="gJade" cx="0.06" cy="-0.02" r="1.1">
      <stop offset="0" stop-color="#CFF3E7"/>
      <stop offset="1" stop-color="#CFF3E7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gAmber" cx="1.02" cy="0.02" r="0.85">
      <stop offset="0" stop-color="#FFE7C6"/>
      <stop offset="1" stop-color="#FFE7C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBlue" cx="0.5" cy="1.06" r="1">
      <stop offset="0" stop-color="#DCEAF4"/>
      <stop offset="1" stop-color="#DCEAF4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mcCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B43318"/>
      <stop offset="1" stop-color="#E8871E"/>
    </linearGradient>
    <linearGradient id="dialRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE0C4"/>
      <stop offset="1" stop-color="#00695C"/>
    </linearGradient>
    <linearGradient id="navGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="statusGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="s1"><rect x="54" y="24" width="292" height="592" rx="26"/></clipPath>
    <clipPath id="s2"><rect x="474" y="24" width="292" height="592" rx="26"/></clipPath>
    <clipPath id="s3"><rect x="894" y="24" width="292" height="592" rx="26"/></clipPath>
  </defs>


  <!-- ══ 1 · Kasa listesi ══════════════════════════════════════════════ -->
